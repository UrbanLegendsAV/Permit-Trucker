<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <!-- Crosshair icon -->
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#1B4FD8" stroke-width="2.5"/>
    <line x1="-38" y1="0" x2="-18" y2="0" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="38" y2="0" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-38" x2="0" y2="-18" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="38" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="0,-10 7,0 0,10 -7,0" fill="#00C896"/>
  </g>
  <!-- "Permit" text - white for dark backgrounds -->
  <text x="93" y="52" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF">Permit</text>
  <!-- "Pilot" text -->
  <text x="205" y="52" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#4B83FF">Pilot</text>
</svg>
