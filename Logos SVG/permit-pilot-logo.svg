<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <!-- Crosshair icon -->
  <g transform="translate(40, 40)">
    <!-- Circle -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#1B4FD8" stroke-width="2.5"/>
    <!-- Horizontal line - left -->
    <line x1="-38" y1="0" x2="-18" y2="0" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Horizontal line - right -->
    <line x1="18" y1="0" x2="38" y2="0" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Vertical line - top -->
    <line x1="0" y1="-38" x2="0" y2="-18" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Vertical line - bottom -->
    <line x1="0" y1="18" x2="0" y2="38" stroke="#1B4FD8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Diamond -->
    <polygon points="0,-10 7,0 0,10 -7,0" fill="#00C896"/>
  </g>
  <!-- "Permit" text with light blue highlight background -->
  <rect x="88" y="22" width="110" height="38" rx="4" fill="#D6E4FF" opacity="0.5"/>
  <!-- "Permit" text -->
  <text x="93" y="52" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#0A0F1E">Permit</text>
  <!-- "Pilot" text -->
  <text x="205" y="52" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#1B4FD8">Pilot</text>
</svg>
