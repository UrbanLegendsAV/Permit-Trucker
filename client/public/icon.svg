<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Crosshair circle -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1B4FD8" stroke-width="3"/>
  <!-- Horizontal line - left -->
  <line x1="4" y1="32" x2="18" y2="32" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round"/>
  <!-- Horizontal line - right -->
  <line x1="46" y1="32" x2="60" y2="32" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round"/>
  <!-- Vertical line - top -->
  <line x1="32" y1="4" x2="32" y2="18" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round"/>
  <!-- Vertical line - bottom -->
  <line x1="32" y1="46" x2="32" y2="60" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round"/>
  <!-- Diamond (emerald green) -->
  <polygon points="32,24 38,32 32,40 26,32" fill="#00C896"/>
